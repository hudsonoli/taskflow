services:
  postgres:
    image: postgres:16.4-alpine
    container_name: taskfloww-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-taskfloww}
      POSTGRES_USER: ${POSTGRES_USER:-taskfloww}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - taskfloww_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-taskfloww}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  taskfloww_postgres_data:
